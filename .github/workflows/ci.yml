name: CI — verify and publish image
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Static analysis
        run: python -m pylint app tests --score=no
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -v
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t training-app:${{ github.sha }} .
      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 127.0.0.1:18080:5000 training-app:${{ github.sha }}
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          ready=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:18080/health > health.json; then
              python -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo '::error::/health did not respond after 15 attempts'
            exit 1
          fi
          docker exec smoke id
          cat health.json
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=ghcr.io/i-fyod/devops-ci-app
          docker tag training-app:${{ github.sha }} "$image:latest"
          docker tag training-app:${{ github.sha }} "$image:${{ github.sha }}"
          docker push "$image:latest"
          docker push "$image:${{ github.sha }}"
